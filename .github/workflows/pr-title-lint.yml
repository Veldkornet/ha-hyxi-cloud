name: PR Title Lint

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: none

jobs:
  lint-title:
    # pre-commit.ci's autoupdate title isn't conventional-commit and isn't ours to change.
    # Check the PR author, not github.actor — a later event (e.g. Sourcery editing the
    # PR description) fires with a different actor and would otherwise slip past this guard.
    if: github.event.pull_request.user.login != 'pre-commit-ci[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Validate PR title follows Conventional Commits
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
