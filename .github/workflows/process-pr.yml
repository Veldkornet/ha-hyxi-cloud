name: "2. Process PR Labels (Privileged)"

on:
  workflow_run:
    workflows: ["1. Receive PR (Untrusted)"]
    types: [completed]

# 🛑 1. Baseline: No global permissions
permissions:
  contents: none

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success' }}

    # ✅ 2. Scoped Permissions: Restricted to the specific job
    permissions:
      pull-requests: write # To read PR labels and metadata
      statuses: write      # To create the Green Check/Red X on the commit
      issues: write        # To comment on the PR if labels are missing
      actions: read        # Required to download artifacts from the 'workflow_run' source

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
      - name: Download PR Metadata
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pr-metadata
          path: pr-metadata
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read PR Data
        id: pr_data
        run: |
          PR_NUMBER=$(tr -d '\n' < pr-metadata/pr_number)
          PR_SHA=$(tr -d '\n' < pr-metadata/pr_sha)
          echo "PR_NUMBER=$PR_NUMBER" >> "$GITHUB_ENV"
          echo "PR_SHA=$PR_SHA" >> "$GITHUB_ENV"

      - name: Apply Labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: "pr-metadata/labeler.yml"
          pr-number: ${{ env.PR_NUMBER }}
          sync-labels: false

      - name: Verify & Enforce Labels
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prNumber = parseInt(process.env.PR_NUMBER, 10);
            const prSha = process.env.PR_SHA;

            // Wrapped so any API call failing here (fetch, addLabels,
            // createCommitStatus itself) still leaves a status posted --
            // otherwise the job just stops and "Label Enforcement" is left
            // pending forever instead of failing visibly.
            try {
              // Fetch the labels Apply Labels just set
              const { data: pullRequest } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
              });

              let labels = pullRequest.labels;

              // actions/labeler v7 dropped "author" as a matcher (see
              // labeler.yml), so unlike dependabot -- which self-labels its
              // own PRs -- pre-commit.ci's autoupdate PRs never pick up
              // "dependencies" from that file. Path alone can't stand in for
              // it: .pre-commit-config.yaml also changes for non-version-bump
              // reasons (adding/removing a hook, changing args), so this
              // checks author identity instead of extending that glob. Reuses
              // the PR already fetched above rather than a second API call.
              if (pullRequest.user?.login === "pre-commit-ci[bot]") {
                const { data: updatedLabels } = await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  labels: ["dependencies"],
                });
                labels = updatedLabels;
              } else if (!pullRequest.user) {
                // Ghost/deleted author (e.g. an account got renamed or
                // removed) -- there's no login to compare against
                // "pre-commit-ci[bot]", so whether this PR should have
                // gotten the dependencies label is unknown, not skipped
                // because it definitely wasn't a match. Logged so that
                // stays visible instead of silently no-op'ing.
                core.warning(`PR #${prNumber} has no author on record; could not check whether it should get the pre-commit.ci "dependencies" label.`);
              }

              const hasLabels = labels.length > 0;

              // 1. Update the PR's visual status check (Green Check or Red X)
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: prSha,
                state: hasLabels ? 'success' : 'error',
                context: 'Label Enforcement',
                description: hasLabels ? `Found ${labels.length} label(s)` : 'No labels found. Please add one.',
              });

              // 2. Add a helpful comment if it failed
              if (!hasLabels) {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: prNumber,
                  body: "❌ **Label Check Failed:** I couldn't automatically label this PR, and no manual labels were added. Please add a label (e.g., `bugfix`, `new-feature`) so the Release Drafter can categorize it!"
                });
                core.setFailed("No labels found.");
              } else {
                console.log(`✅ PR is labeled with: ${labels.map(l => l.name).join(", ")}`);
              }
            } catch (error) {
              core.warning(`Label verification failed: ${error.message}`);
              await github.rest.repos.createCommitStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                sha: prSha,
                state: 'error',
                context: 'Label Enforcement',
                description: 'Label check errored -- see workflow run logs.',
              });
              core.setFailed(`Label verification failed: ${error.message}`);
            }
