name: Release Drafter

on:
  push:
    branches:
      - main
  pull_request_target:
    # 🚀 Added 'edited' so renaming a PR updates the draft immediately
    types: [opened, reopened, synchronize, labeled, edited]
  release:
    # Publishing either draft (beta or stable) doesn't touch main or any PR,
    # so without this the *other* draft would sit showing stale pre-publish
    # content until the next push/PR event happened to trigger a refresh.
    # commitish is hardcoded to main below regardless of trigger, so this
    # is safe to fire on any release event.
    types: [published]

concurrency:
  group: release-drafter
  cancel-in-progress: false

# 🛑 1. Baseline: No permissions allowed by default
permissions:
  contents: none

jobs:
  update_release_draft:
    # ✅ 2. Specifically grant permissions to this job only
    permissions:
      contents: write   # Required to create/update the release draft
      pull-requests: write # Required to read PR labels and metadata
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      # Beta track: since whatever was last *published* (beta or stable),
      # auto-incrementing the beta counter -- see release-drafter.yml's
      # own prerelease/prerelease-identifier/latest settings.
      - name: Update Beta Draft
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          commitish: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Stable track: same config, but these action inputs override
      # prerelease/latest for this run only. findPreviousReleases() then
      # skips betas when picking the "last release" baseline, so this
      # draft accumulates every change since the last real stable release,
      # however many betas happened in between -- publishing it is a
      # single click with the version and changelog already correct, no
      # manual tag/prerelease-checkbox editing needed.
      - name: Update Stable Draft
        uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          commitish: main
          # prerelease: false is the only override that matters here --
          # it's a boolean input (checked by type, not truthiness) so it
          # reliably overrides the config's prerelease: true. An empty-string
          # prerelease-identifier override was tried too, but release-drafter
          # treats '' as "no input given" (falsy) and keeps the config's
          # 'beta', so it's omitted rather than left in as dead config; it's
          # inert today since prerelease: false already gates every place
          # the identifier would show up in $RESOLVED_VERSION.
          prerelease: 'false'
          latest: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
