[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-hyxi-cloud"
version = "1.7.0-beta.4"
description = "HYXI ⚡️🔋☀️ Integration for HomeAssistant"
readme = "README.md"
authors = [
    { name = "Veldkornet" }
]
requires-python = ">=3.14.2,<3.15"
dependencies = [
    "aiohttp>=3.13.5",
    "voluptuous",
    "hyxi-cloud-api>=1.4.7",
    # Local RS485 transport (imported lazily; a cloud-only entry never loads it).
    "modbus-connection[tmodbus]>=4.10.0",
    # Listed explicitly too: HA's requirement installer checks package+version
    # only, not extras, so a bare modbus-connection pulled in by something
    # else can mask this and leave tmodbus itself uninstalled. Floors track
    # what Core's `modbus` integration currently pins (4.10.0 / 0.6.2), so
    # its own install already satisfies ours.
    "tmodbus[async-serial]>=0.6.2",
]

[project.optional-dependencies]
# Dev-only: tools/modbus_probe.py needs a Modbus stack to talk to hardware.
# modbus-connection[tmodbus] is already a runtime dependency above; it's
# repeated here so this extra is self-contained. pymodbus is not a runtime
# dependency -- it's only for tools/fake_hyxi.py, which needs a Modbus
# *server* that tmodbus does not provide.
modbus = [
    "modbus-connection[tmodbus]>=4.10.0",
    # tools/fake_hyxi.py needs a Modbus *server*, which tmodbus does not provide.
    "pymodbus>=3.15.0",
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.165.5",
    "pytest-homeassistant-custom-component>=0.13.355",
    "mypy>=2.3.0",
    # The local Modbus transport now reaches its device through Core's
    # `modbus` integration (async_get_unit). Importing that module pulls in
    # homeassistant/components/modbus/modbus.py, which imports pymodbus at
    # module level -- so the test env needs pymodbus even though our own
    # code never imports it. At runtime Core installs it from the `modbus`
    # manifest (==3.13.1); it is deliberately absent from our manifest.json
    # requirements so the two pins can never disagree.
    "pymodbus>=3.13.1",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "S", "N", "PTH", "RUF"
]
ignore = ["E501", "N818", "S105", "N999"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "N802", "E402"]
"custom_components/hyxi_cloud/__init__.py" = ["N812"]

[tool.vulture]
paths = ["custom_components"]
min_confidence = 80
ignore_names = ["kwargs", "entry_data"]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--ignore=tests/integration"

[tool.coverage.run]
source = ["custom_components/hyxi_cloud"]

[tool.coverage.report]
show_missing = true
# NOTE: fail_under is intentionally NOT set here. This config is read by
# both the unit and integration pytest-cov runs individually (each only
# partially covers the codebase -- e.g. engine.py needs both suites
# combined to reach 100%), and a fail_under here would apply to each of
# those partial runs too, failing CI long before the two get combined.
# The 100% floor is instead enforced by .github/workflows/tests.yml's
# "Check coverage" step, via `coverage report --fail-under=100`, run once
# after both suites have written into the same --cov-append'd .coverage
# file. If you need this locally, run the same two pytest invocations
# from that workflow before `coverage report --fail-under=100`.

[tool.pylint.similarities]
min-similarity-lines = 100

[tool.pylint.messages_control]
disable = [
    "line-too-long",
    "import-error",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-branches",
    "too-many-return-statements",
    "too-many-nested-blocks",
    "too-many-locals",
    "missing-class-docstring",
    "missing-function-docstring",
    "try-except-raise",
    "redefined-outer-name",
    "protected-access",
    "unused-argument",
    "reimported",
    "duplicate-code",
    "import-outside-toplevel",
    "wrong-import-order",
    "wrong-import-position",
    "no-value-for-parameter",
    "assignment-from-none",
    "unsupported-membership-test",
    "too-many-statements",
    "too-many-lines",
    "too-many-public-methods",
    "consider-using-from-import",
]
