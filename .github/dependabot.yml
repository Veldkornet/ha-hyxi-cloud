version: 2
updates:
  # 1. Keep GitHub Actions up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      codeql:
        patterns:
          - "github/codeql-action*"

  # 2. Keep Python dependencies (pyproject.toml + uv.lock) up to date
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
