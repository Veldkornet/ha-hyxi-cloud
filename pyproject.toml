[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-hyxi-cloud"
version = "1.6.5"
description = "HYXI ⚡️🔋☀️ Integration for HomeAssistant using HYXI Cloud ☁️"
readme = "README.md"
authors = [
    { name = "Veldkornet" }
]
requires-python = ">=3.14.2"
dependencies = [
    "aiohttp>=3.13.5",
    "voluptuous",
    "hyxi-cloud-api>=1.4.2",
]

[project.optional-dependencies]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6.157.0",
    "pytest-homeassistant-custom-component>=0.13.346",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "S", "N", "PTH", "RUF"
]
ignore = ["E501", "N818", "S105", "N999"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "N802", "E402"]
"custom_components/hyxi_cloud/__init__.py" = ["N812"]

[tool.vulture]
paths = ["custom_components"]
min_confidence = 80
ignore_names = ["kwargs", "entry_data"]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--ignore=tests/integration"

[tool.pylint.similarities]
min-similarity-lines = 100

[tool.pylint.messages_control]
disable = [
    "line-too-long",
    "import-error",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-branches",
    "too-many-return-statements",
    "too-many-nested-blocks",
    "too-many-locals",
    "missing-class-docstring",
    "missing-function-docstring",
    "try-except-raise",
    "redefined-outer-name",
    "protected-access",
    "unused-argument",
    "reimported",
    "duplicate-code",
    "import-outside-toplevel",
    "wrong-import-order",
    "wrong-import-position",
    "no-value-for-parameter",
    "assignment-from-none",
    "unsupported-membership-test",
    "too-many-statements",
    "too-many-lines",
    "consider-using-from-import",
]
