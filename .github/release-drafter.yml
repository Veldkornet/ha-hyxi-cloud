name-template: '$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
# $PRERELEASE renders as e.g. "-beta.3" (empty when there's no prerelease
# identifier on the resolved version) -- version-template only substitutes
# placeholders that are actually present in the string, so this must be
# listed explicitly or the -beta.N suffix silently never appears.
version-template: '$MAJOR.$MINOR.$PATCH$PRERELEASE'

# These settings apply as-is to this file's default (beta) invocation in
# release-drafter.yml (the workflow). That workflow runs this same config
# a second time with prerelease/latest action-input overrides to also
# maintain a separate stable draft -- see the "Update Stable Draft" step
# there, and CONTRIBUTING.md's "Two release drafts" section, for how the
# two tracks divide up.
prerelease: true
prerelease-identifier: 'beta'
latest: false

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
sort-direction: ascending

categories:
  - title: "📚 Documentation"
    labels:
      - "documentation"
  - title: "💥 Breaking Changes"
    labels:
      - "breaking-change"
  - title: "✨ New Features"
    labels:
      - "new-feature"
  - title: "🐛 Bug Fixes"
    labels:
      - "bugfix"
      - "bug" # defensive: catches accidental use of the issue-template label on a PR
  # Ordered before CI/Chore/Style/etc and marked exclusive: a version-bump
  # PR (dependabot, or pre-commit autoupdate) commonly also carries one of
  # those file-path-based labels (e.g. touching .github/**/* also matches
  # "ci"), and by default release-drafter lists a PR under *every* matching
  # category rather than just the first -- without `exclusive`, the same
  # PR would show up duplicated under both "Dependency Updates" and "CI".
  - title: "⬆️ Dependency Updates"
    labels:
      - "dependencies"
    exclusive: true
    collapse-after: 3
  - title: "🎨 Style"
    labels:
      - "style"
  - title: "🌐 Translations"
    labels:
      - "translations"
  - title: "📦 Refactor"
    labels:
      - "refactor"
  - title: "🚀 Performance"
    labels:
      - "performance"
  - title: "🧪 Test"
    labels:
      - "test"
  - title: "🛠️ Build"
    labels:
      - "build"
  - title: "⚙️ CI"
    labels:
      - "ci"
    collapse-after: 3
  - title: "♻️ Chore"
    labels:
      - "chore"
  - title: "🗑️ Revert"
    labels:
      - "revert"

template: |
  # HYXI $RESOLVED_VERSION ⚡🔋☀️

  ## 🚀 Key Improvements

  $CHANGES

  ---

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

version-resolver:
  major:
    labels:
      - "breaking-change"
  minor:
    labels:
      - "new-feature"
  patch:
    labels:
      - "bugfix"
      - "bug"
      - "chore"
      - "dependencies"
  default: patch
