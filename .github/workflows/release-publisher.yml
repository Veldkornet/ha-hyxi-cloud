name: Release Publisher

on:
  release:
    types: [published]

# 🛑 1. Start with zero permissions at the top level
permissions:
  contents: none

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    # ✅ 2. Explicitly grant 'write' ONLY for release publishing, PR creation, and labeling
    permissions:
      contents: write # To read the code, upload asset, and push version bump branch
      pull-requests: write # To open the pull request for manifest version update
      issues: write # Required by create-pull-request to add labels to the PR

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github-releases.s3.amazonaws.com:443
            github.com:443
            objects.githubusercontent.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            releases.astral.sh:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      - name: 📥 Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📝 Inject Version into Manifest and pyproject.toml
        run: |
          # Grab the release tag (e.g., v1.3.0) and strip the 'v'
          TAG_NAME="${{ github.event.release.tag_name }}"
          CLEAN_VERSION="${TAG_NAME#v}"
          echo "CLEAN_VERSION=${CLEAN_VERSION}" >> $GITHUB_ENV
          export CLEAN_VERSION

          echo "Checking/Injecting version $CLEAN_VERSION into manifest and pyproject.toml..."
          python3 -c "
          import os, re, pathlib, json
          clean_ver = os.environ['CLEAN_VERSION']

          manifest_path = pathlib.Path('custom_components/hyxi_cloud/manifest.json')
          manifest_text = manifest_path.read_text(encoding='utf-8')
          manifest_data = json.loads(manifest_text)
          if manifest_data.get('version') != clean_ver:
              new_manifest_text = re.sub(r'\"version\":\s*\"[^\"]+\"', f'\"version\": \"{clean_ver}\"', manifest_text)
              manifest_path.write_text(new_manifest_text, encoding='utf-8')

          pyproject_path = pathlib.Path('pyproject.toml')
          pyproject_text = pyproject_path.read_text(encoding='utf-8')
          version_match = re.search(r'(?m)^version\s*=\s*\"([^\"]+)\"', pyproject_text)
          if version_match and version_match.group(1) != clean_ver:
              new_pyproject_text = re.sub(r'(?m)^version\s*=\s*\"[^\"]+\"', f'version = \"{clean_ver}\"', pyproject_text)
              pyproject_path.write_text(new_pyproject_text, encoding='utf-8')
          "

      - name: 📦 Create Zip Archive
        run: |
          # Go INSIDE the integration folder and zip the contents
          # This ensures manifest.json is at the root of the zip file
          cd custom_components/hyxi_cloud
          zip -r ../../hyxi_cloud.zip .
          cd ../..

      - name: 🚀 Upload Zip to Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: hyxi_cloud.zip
          tag_name: ${{ github.event.release.tag_name }}
          overwrite_files: true

      - name: 🔧 Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true
          cache-python: true

      - name: 🔒 Refresh uv.lock
        # pyproject.toml's version may have just changed above; uv.lock
        # records that version too (in its own [[package]] entry for this
        # project), so it needs regenerating in lockstep or CI's later
        # `uv sync --locked` and pre-commit.ci's uv-lock hook both reject
        # the drifted lockfile.
        run: uv lock

      - name: 🔄 Verify Version Parity
        run: |
          python3 scripts/sync_versions.py

      - name: 🔀 Create Pull Request for Version Bump
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(release): bump manifest and pyproject version to ${{ env.CLEAN_VERSION }}"
          title: "chore(release): bump manifest and pyproject version to ${{ env.CLEAN_VERSION }}"
          branch: "chore/bump-version-${{ env.CLEAN_VERSION }}"
          branch-suffix: "timestamp"
          delete-branch: true
          base: main
          labels: "chore"
          # Explicit allowlist rather than the default "commit everything
          # that changed" -- hyxi_cloud.zip built above is a release asset,
          # not something that belongs in this PR, and this keeps it (or
          # any other future stray build output) out of the commit.
          add-paths: |
            custom_components/hyxi_cloud/manifest.json
            pyproject.toml
            uv.lock
          body: |
            ## Summary
            Automated pull request triggered by release publishing to synchronize `manifest.json`, `pyproject.toml`, and `uv.lock` in `main`.

            ## Key Changes
            - Updated `custom_components/hyxi_cloud/manifest.json` version to `${{ env.CLEAN_VERSION }}`.
            - Synced `pyproject.toml` version to `${{ env.CLEAN_VERSION }}`.
            - Refreshed `uv.lock` to match.

            ## Why this is needed
            Maintains source-of-truth version parity across `manifest.json`, `pyproject.toml`, `uv.lock`, and GitHub Releases after a release is published.
