name-template: '$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
# $PRERELEASE renders as e.g. "-beta.3" (empty when there's no prerelease
# identifier on the resolved version) -- version-template only substitutes
# placeholders that are actually present in the string, so this must be
# listed explicitly or the -beta.N suffix silently never appears.
version-template: '$MAJOR.$MINOR.$PATCH$PRERELEASE'

# Draft accumulates automatically on every push to main, same as before.
# It now defaults to a pre-release (v$MAJOR.$MINOR.$PATCH-beta.N) so hitting
# "Publish release" as-is ships a beta. To ship stable instead: untick
# "Set as a pre-release", drop the -beta.N suffix from the tag, and tick
# "Set as the latest release" (latest: false below means that box starts
# unticked on every draft, pre-release or not).
prerelease: true
prerelease-identifier: 'beta'
latest: false

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
sort-direction: ascending
exclude-contributors:
  - "dependabot[bot]"

categories:
  - title: "📚 Documentation"
    labels:
      - "documentation"
  - title: "💥 Breaking Changes"
    labels:
      - "breaking-change"
  - title: "✨ New Features"
    labels:
      - "new-feature"
  - title: "🐛 Bug Fixes"
    labels:
      - "bugfix"
      - "bug" # defensive: catches accidental use of the issue-template label on a PR
  - title: "🎨 Style"
    labels:
      - "style"
  - title: "🌐 Translations"
    labels:
      - "translations"
  - title: "📦 Refactor"
    labels:
      - "refactor"
  - title: "🚀 Performance"
    labels:
      - "performance"
  - title: "🧪 Test"
    labels:
      - "test"
  - title: "🛠️ Build"
    labels:
      - "build"
  - title: "⚙️ CI"
    labels:
      - "ci"
  - title: "♻️ Chore"
    labels:
      - "chore"
  - title: "🗑️ Revert"
    labels:
      - "revert"
  - title: "⬆️ Dependency Updates"
    labels:
      - "dependencies"
    collapse-after: 3

template: |
  # HYXI $RESOLVED_VERSION ⚡🔋☀️

  This release focuses on significantly improved reliability and diagnostic visibility for your HYXi Cloud devices.

  ![Coverage](https://img.shields.io/badge/coverage-100%25-brightgreen.svg?style=flat-square)
  ![Quality](https://img.shields.io/badge/quality-premium-blue.svg?style=flat-square)

  ---

  ## 🚀 Key Improvements

  $CHANGES

  ---

  ## 🧪 Reliability Spotlight
  This release was built with **100% automated test coverage** and robust numeric safety nets to ensure your energy data is accurate and resilient. Every sensor from PV yield to battery SOH is now fully validated.

  ---

  ## 📦 Deployment status
  - **HACS**: 🟢 Ready
  - **Docker Sandbox**: 🟢 Passing
  - **Local Integration Test**: 🟢 100%

  ---

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

  ## 🧡 Contributors
  $CONTRIBUTORS

version-resolver:
  major:
    labels:
      - "breaking-change"
  minor:
    labels:
      - "new-feature"
  patch:
    labels:
      - "bugfix"
      - "bug"
      - "chore"
      - "dependencies"
  default: patch
