name-template: '$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
# $PRERELEASE renders as e.g. "-beta.3" (empty when there's no prerelease
# identifier on the resolved version) -- version-template only substitutes
# placeholders that are actually present in the string, so this must be
# listed explicitly or the -beta.N suffix silently never appears.
version-template: '$MAJOR.$MINOR.$PATCH$PRERELEASE'

# These settings apply as-is to this file's default (beta) invocation in
# release-drafter.yml (the workflow). That workflow runs this same config
# a second time with prerelease/latest action-input overrides to also
# maintain a separate stable draft -- see the "Update Stable Draft" step
# there, and CONTRIBUTING.md's "Two release drafts" section, for how the
# two tracks divide up.
prerelease: true
prerelease-identifier: 'beta'
latest: false

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
sort-direction: ascending

categories:
  # Hides pure housekeeping (labels-mode: only -- ALL labels must be in
  # this set). IMPORTANT: a PR matching neither this nor any category
  # below is NOT hidden -- release-drafter dumps unmatched PRs untitled
  # above every real section instead. dependabot's native "dependencies"
  # label + ecosystem tags (github_actions/python/python:uv) are included
  # here for exactly that reason (dev/test-only bumps have no other
  # label); a genuine "runtime-deps" change is unaffected since that
  # label is never in this set.
  - type: "pre-exclude"
    when:
      labels:
        [
          "ci",
          "test",
          "build",
          "chore",
          "dependencies",
          "github_actions",
          "python",
          "python:uv",
        ]
      labels-mode: "only"
  # Every category below is exclusive: true, so with all of them now
  # exclusive, declaration order = priority -- the first match wins and the
  # PR is never checked against the rest. A PR can legitimately carry more
  # than one label (a breaking-change PR that also updates a .md file picks
  # up "documentation" too), so what matters most to a user reading the
  # release notes needs to be listed first, or it'd get buried under a
  # less important category instead. Documentation/Style/Translations/etc
  # are ordered after the categories that actually signal user impact.
  - title: "💥 Breaking Changes"
    when:
      labels: ["breaking-change"]
    exclusive: true
  # Ranked above Bug Fixes: a revert is notable in its own right (something
  # previously shipped got undone), so a PR manually labeled both "bugfix"
  # and "revert" should read as a revert, not get buried under Bug Fixes.
  - title: "🗑️ Revert"
    when:
      labels: ["revert"]
    exclusive: true
  - title: "✨ New Features"
    when:
      labels: ["new-feature"]
    exclusive: true
  - title: "🐛 Bug Fixes"
    when:
      # "bug" is defensive: catches accidental use of the issue-template
      # label on a PR.
      labels: ["bugfix", "bug"]
    exclusive: true
  # "runtime-deps" is applied by process-pr.yml's "Verify & Enforce Labels"
  # step, not dependabot's own native "dependencies" (left untouched, but
  # not curated enough to filter the changelog on -- see that step and
  # labeler.yml for the full reasoning). Ordered before CI/Chore/Style/etc
  # and marked exclusive like every other category here: by default
  # release-drafter lists a PR under *every* matching category rather than
  # just the first, so a PR that both bumps a dependency and touches
  # something else (rare, but not impossible for a manual edit) would
  # otherwise show up duplicated.
  - title: "⬆️ Dependency Updates"
    when:
      labels: ["runtime-deps"]
    exclusive: true
    collapse-after: 3
  - title: "📚 Documentation"
    when:
      labels: ["documentation"]
    exclusive: true
  - title: "🌐 Translations"
    when:
      labels: ["translations"]
    exclusive: true
  - title: "🎨 Style"
    when:
      labels: ["style"]
    exclusive: true
  - title: "📦 Refactor"
    when:
      labels: ["refactor"]
    exclusive: true
  - title: "🚀 Performance"
    when:
      labels: ["performance"]
    exclusive: true
  - title: "🧪 Test"
    when:
      labels: ["test"]
    exclusive: true
  - title: "🛠️ Build"
    when:
      labels: ["build"]
    exclusive: true
  # No visible "CI" category: "ci"-only PRs are already hidden via
  # pre-exclude above.
  - title: "♻️ Chore"
    when:
      labels: ["chore"]
    exclusive: true

template: |
  # HYXI $RESOLVED_VERSION ⚡🔋☀️

  ## 🚀 Key Improvements

  $CHANGES

  ---

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION

version-resolver:
  major:
    labels:
      - "breaking-change"
  minor:
    labels:
      - "new-feature"
  patch:
    labels:
      - "bugfix"
      - "bug"
      - "chore"
      - "runtime-deps"
  default: patch
