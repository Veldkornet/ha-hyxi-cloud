cancel_subscription:
  name: Cancel Subscription
  description: Manually cancel an active or orphaned push/alarm subscription on the HYXI Cloud server.
  fields:
    subscribe_code:
      name: Subscription Code
      description: The 32-character subscription code/ID. You can find active/orphaned codes inside Home Assistant's internal storage files (".storage/core.config_entries" or ".storage/hyxi_cloud_subscriptions" - advanced users only).
      example: "A1B2C3D4E5F6G7H8I9J0K1L2M3N4O5P6"
      required: true
      selector:
        text:

set_battery_mode:
  name: Set battery mode
  description: >-
    Send a battery operating-mode command to a HYXI inverter. Requires "Device
    Control & Protection" to be enabled for that entry. Refused while the Energy
    Manager is managing the target inverter, unless Force is set.
  target:
    entity:
      integration: hyxi_cloud
  fields:
    mode:
      name: Mode
      description: The battery operating mode to switch to.
      required: true
      selector:
        select:
          translation_key: battery_mode
          options:
            - idle
            - charge
            - discharge
            - self_consume
    power:
      name: Power
      description: >-
        Charge or discharge power in watts. Ignored for idle and self-consume.
        When omitted, the inverter's Charge/Discharge Power number is used (or
        100 W if that has never been set).
      example: 2500
      selector:
        number:
          min: 0
          max: 20000
          step: 50
          unit_of_measurement: W
          mode: box
    force:
      name: Force
      description: >-
        Send the command even while the Energy Manager is managing this
        inverter. The Energy Manager will override it again on its next decision.
      default: false
      selector:
        boolean:
