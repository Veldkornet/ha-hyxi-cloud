[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ha-hyxi-cloud"
version = "1.6.6"
description = "HYXI ⚡️🔋☀️ Integration for HomeAssistant using HYXI Cloud ☁️"
readme = "README.md"
authors = [
    { name = "Veldkornet" }
]
requires-python = ">=3.14.2"
dependencies = [
    "aiohttp>=3.13.5",
    "voluptuous",
    "hyxi-cloud-api>=1.4.4",
]

[project.optional-dependencies]
# Dev-only: tools/modbus_probe.py needs a Modbus stack to talk to hardware.
# Deliberately NOT in [project].dependencies -- that list is mirrored into
# manifest.json by scripts/sync_versions.py, and nothing the integration
# ships at runtime imports this yet.
modbus = [
    "modbus-connection[tmodbus]>=4.8.1",
    # tools/fake_hyxi.py needs a Modbus *server*, which tmodbus does not provide.
    "pymodbus>=3.15.0",
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.165.5",
    "pytest-homeassistant-custom-component>=0.13.355",
    "mypy>=2.3.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "S", "N", "PTH", "RUF"
]
ignore = ["E501", "N818", "S105", "N999"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S105", "S106", "N802", "E402"]
"custom_components/hyxi_cloud/__init__.py" = ["N812"]

[tool.vulture]
paths = ["custom_components"]
min_confidence = 80
ignore_names = ["kwargs", "entry_data"]

[tool.setuptools.packages.find]
include = ["custom_components*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--ignore=tests/integration"

[tool.coverage.run]
source = ["custom_components/hyxi_cloud"]

[tool.coverage.report]
show_missing = true
# NOTE: fail_under is intentionally NOT set here. This config is read by
# both the unit and integration pytest-cov runs individually (each only
# partially covers the codebase -- e.g. engine.py needs both suites
# combined to reach 100%), and a fail_under here would apply to each of
# those partial runs too, failing CI long before the two get combined.
# The 100% floor is instead enforced by .github/workflows/tests.yml's
# "Check coverage" step, via `coverage report --fail-under=100`, run once
# after both suites have written into the same --cov-append'd .coverage
# file. If you need this locally, run the same two pytest invocations
# from that workflow before `coverage report --fail-under=100`.

[tool.pylint.similarities]
min-similarity-lines = 100

[tool.pylint.messages_control]
disable = [
    "line-too-long",
    "import-error",
    "too-few-public-methods",
    "too-many-instance-attributes",
    "too-many-branches",
    "too-many-return-statements",
    "too-many-nested-blocks",
    "too-many-locals",
    "missing-class-docstring",
    "missing-function-docstring",
    "try-except-raise",
    "redefined-outer-name",
    "protected-access",
    "unused-argument",
    "reimported",
    "duplicate-code",
    "import-outside-toplevel",
    "wrong-import-order",
    "wrong-import-position",
    "no-value-for-parameter",
    "assignment-from-none",
    "unsupported-membership-test",
    "too-many-statements",
    "too-many-lines",
    "consider-using-from-import",
]
