# NOTE: process-pr.yml pins actions/labeler@v7.0.0, which only supports
# changed-files/base-branch/head-branch matchers -- "title" and "author"
# (used pre-v7 to key new-feature/breaking-change/bugfix/refactor off
# conventional-commit prefixes, and dependencies off the dependabot author)
# are silently invalid and were observed to also suppress a label's other,
# valid match entries, not just themselves. Where a head-branch convention
# exists it's kept below as the only signal; where it doesn't
# (breaking-change), there's no automatic matcher left -- label by hand.

# 🚀 New Features (Logic changes)
"new-feature":
  - head-branch: ["^feature/", "^feat/"]

# 💥 Breaking Changes (conventional-commit "!" marker, e.g. "feat!:" or "fix(api)!:")
"breaking-change": []

# 🐛 Bug Fixes (file paths can't signal fix-vs-feature intent either, so
# branch name is the only matcher available)
"bugfix":
  - head-branch: ["^fix/", "^bug/"]

# 🎨 Style
"style":
  - changed-files:
      - any-glob-to-any-file:
          - "custom_components/hyxi_cloud/static/**/*"
          - "custom_components/hyxi_cloud/brand/**/*"

# 🌐 Translations
"translations":
  - changed-files:
      - any-glob-to-any-file:
          - "custom_components/hyxi_cloud/strings.json"
          - "custom_components/hyxi_cloud/translations/**/*"

# 🧪 Tests
"test":
  - changed-files:
      - any-glob-to-any-file: "tests/**/*"

# 📦 Refactor
"refactor":
  - head-branch: ["^refactor/"]

# ⬆️ Dependency Updates
# Deliberately NOT a changed-files rule here: see process-pr.yml's "Verify
# & Enforce Labels" step, which applies "dependencies" by diffing
# manifest.json's requirements array instead -- a path glob on
# pyproject.toml/uv.lock can't tell a real dependency bump apart from a
# plain version bump (both touch those files).

# ♻️ Chore (Metadata & Housekeeping)
"chore":
  - changed-files:
      - any-glob-to-any-file:
          - "custom_components/hyxi_cloud/manifest.json"
          - "hacs.json" # repo-root HACS manifest — no per-integration copy exists
          - ".gitignore"

# Label for GitHub Actions, Scripts, and Repo Infrastructure
"ci":
  - changed-files:
      - any-glob-to-any-file:
          - ".github/**/*"  # 🚀 Double asterisks catch all subfolders/files
          - "dev_env/**/*"
          - "scripts/**/*"
          - "benchmarks/**/*"
          - ".agent/**/*"   # AI agent workflow instructions
          - ".agents/**/*"
          - ".jules/**/*"
          - ".vscode/tasks.json"
          - ".pre-commit-config.yaml"
          - ".coderabbit.yaml"
          - ".sourcery.yaml"
          - ".codespellrc"
          - ".python-version"
          - "mypy.ini"
          - "fix_yaml.py"

# 📚 Documentation
"documentation":
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"                        # Root level markdown files
          - "LICENSE"                     # Legal updates
          - "docs/**/*"                   # Anything inside a docs folder
          - ".github/ISSUE_TEMPLATE/*.md" # Issue template updates

# --- HA area labels (triage/filtering only — not release-drafter categories) ---

# 🧩 Core (entry point, shared constants/base entity, service definitions)
"core":
  - changed-files:
      - any-glob-to-any-file:
          - "custom_components/hyxi_cloud/__init__.py"
          - "custom_components/hyxi_cloud/const.py"
          - "custom_components/hyxi_cloud/entity.py"
          - "custom_components/hyxi_cloud/services.yaml"

# 🧭 Config Flow (setup & options UI)
"config-flow":
  - changed-files:
      - any-glob-to-any-file: "custom_components/hyxi_cloud/config_flow.py"

# 📡 Coordinator & Cloud Engine (data fetch/update logic)
"coordinator":
  - changed-files:
      - any-glob-to-any-file:
          - "custom_components/hyxi_cloud/coordinator.py"
          - "custom_components/hyxi_cloud/engine.py"

# 📊 Sensors (readonly entities)
"sensor":
  - changed-files:
      - any-glob-to-any-file:
          - "custom_components/hyxi_cloud/sensor.py"
          - "custom_components/hyxi_cloud/binary_sensor.py"

# 🎛️ Controls (writable entities)
"controls":
  - changed-files:
      - any-glob-to-any-file:
          - "custom_components/hyxi_cloud/switch.py"
          - "custom_components/hyxi_cloud/button.py"
          - "custom_components/hyxi_cloud/number.py"

# 🛡️ Protection (safety/limit logic)
"protection":
  - changed-files:
      - any-glob-to-any-file: "custom_components/hyxi_cloud/protection.py"
