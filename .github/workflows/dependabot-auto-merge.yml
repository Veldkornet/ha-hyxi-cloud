name: Dependabot auto-merge
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: none
  pull-requests: none

# A newer push to the same PR cancels the run checking the previous head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Verify allowed dependencies
        id: verify
        env:
          UPDATED_DEPENDENCIES: ${{ steps.metadata.outputs.updated-dependencies-json }}
        run: |
          set -euo pipefail

          ALLOWED_DEPS=("actions/checkout" "actions/dependency-review-action" "actions/download-artifact" "actions/github-script" "actions/labeler" "actions/stale" "actions/upload-artifact" "amannn/action-semantic-pull-request" "astral-sh/setup-uv" "dependabot/fetch-metadata" "github/codeql-action" "github/codeql-action/init" "github/codeql-action/analyze" "github/codeql-action/upload-sarif" "gitleaks/gitleaks-action" "google/osv-scanner-action/osv-scanner-action" "hacs/action" "home-assistant/actions/hassfest" "ossf/scorecard-action" "release-drafter/release-drafter" "softprops/action-gh-release" "step-security/harden-runner" "pytest" "pytest-asyncio" "pytest-cov" "hypothesis" "mypy" "packaging" "pytest-homeassistant-custom-component")

          DEPS_JSON=${UPDATED_DEPENDENCIES:-[]}
          ALLOWED=true

          # We avoid exiting with a non-zero status below so we don't put a confusing
          # red 'X' (failed CI check) on PRs that simply require a manual review.
          if [ "$(jq 'length' <<< "$DEPS_JSON")" -eq 0 ]; then
            echo "::notice title=Manual Review Required::No dependencies found in metadata. Skipping auto-merge."
            ALLOWED=false
          else
            # Transitive packages only land in uv.lock (dev/CI); manifest.json
            # requirements come from direct dependencies alone.
            DISALLOWED=$(jq -r '[.[] | select(.dependencyType != "indirect") | .dependencyName] - $ARGS.positional | first // empty' --args "${ALLOWED_DEPS[@]}" <<< "$DEPS_JSON")
            if [ -n "$DISALLOWED" ]; then
              echo "::notice title=Manual Review Required::Dependency '$DISALLOWED' is not in the strict allowlist. Skipping auto-merge."
              ALLOWED=false
            fi
          fi

          echo "is_allowed=$ALLOWED" >> "$GITHUB_OUTPUT"

      - name: Approve Dependabot PR
        if: >
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          steps.verify.outputs.is_allowed == 'true'
        run: |
          if ! OUTPUT=$(gh pr review --approve "$PR_URL" 2>&1); then
            echo "::notice title=Approval Failed::Failed to automatically approve PR. This is usually due to permission restrictions. Output: $OUTPUT"
          fi
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Enable auto-merge for Dependabot PRs
        if: >
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          steps.verify.outputs.is_allowed == 'true'
        run: |
          if ! OUTPUT=$(gh pr merge --auto --squash --match-head-commit "$HEAD_SHA" "$PR_URL" 2>&1); then
            if echo "$OUTPUT" | grep -iq "workflow.*permission"; then
              echo "::notice title=Manual Merge Required::GitHub Actions cannot auto-merge PRs that modify workflow files due to security restrictions. Please merge manually."
            else
              echo "::error::Failed to enable auto-merge: $OUTPUT"
              exit 1
            fi
          fi
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          HEAD_SHA: ${{github.event.pull_request.head.sha}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

      # Auto-merge enabled for an earlier head stays on after Dependabot pushes, so turn it off when the current head needs review.
      - name: Disable auto-merge for PRs that need review
        if: >
          steps.metadata.outputs.update-type == 'version-update:semver-major' ||
          steps.verify.outputs.is_allowed != 'true'
        run: |
          if ! OUTPUT=$(gh pr merge --disable-auto "$PR_URL" 2>&1); then
            echo "::notice title=Auto-merge Not Disabled::$OUTPUT"
          fi
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
