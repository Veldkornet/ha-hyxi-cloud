# Test-only exact pins inherited from homeassistant (via
# pytest-homeassistant-custom-component). Keyed by version, so a new pin is
# scanned again as soon as Home Assistant moves it, or once effectiveUntil
# passes if it hasn't.

[[PackageOverrides]]
name = "pillow"
version = "12.3.0"
ecosystem = "PyPI"
ignore = true
effectiveUntil = 2027-01-31
reason = "Test-only; exact pin inherited from homeassistant"
