name: Python Tests
permissions:
  contents: read

# This tells GitHub to run this workflow every time you push or make a Pull Request
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # This gives you a fresh Linux machine for the Antigravity/GitHub runner
    runs-on: ubuntu-latest
    env:
      # uv reads this on every `uv run`/`uv sync` invocation below, so it's
      # set once here rather than repeating `--locked` on each `run:` line --
      # fail fast on lockfile drift instead of silently resolving/installing
      # an unlocked version.
      UV_LOCKED: "1"
      # uv.lock records this project as editable, so installing it invokes
      # its setuptools.build_meta backend, which can execute arbitrary
      # checkout code. Tests don't need it installed -- pyproject.toml's
      # `pythonpath = ["."]` already puts the repo root on sys.path -- so
      # skip that install rather than run our own build backend for no
      # reason. (Third-party deps still get built normally: --no-build
      # can't be added on top of this, since the test extra pulls in
      # mock-open, which only ships as a source distribution on PyPI.)
      UV_NO_INSTALL_PROJECT: "1"

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            files.pythonhosted.org:443
            fulcio.sigstore.dev:443
            ghcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            open.hyxicloud.com:443
            pypi.org:443
            raw.githubusercontent.com:443
            rekor.sigstore.dev:443
            releases.astral.sh:443
            tuf-repo-cdn.sigstore.dev:443
            github-releases.s3.amazonaws.com:443
            release-assets.githubusercontent.com:443

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: '3.14'
          enable-cache: true
          # cache-python defaults to false -- without it, every run
          # re-downloads the full CPython interpreter tarball from GitHub's
          # release CDN, which is a large, single point of flaky-network
          # failure repeated on every job instead of paid for once.
          cache-python: true

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run Unit Tests
        run: uv run pytest tests/ --ignore=tests/integration -v -p no:warnings --cov --cov-report=

      - name: Run Integration Tests
        run: HYXI_INTEGRATION_TEST="1" uv run pytest tests/integration -v -p no:warnings --cov --cov-append --cov-report=

      - name: Check coverage
        # Combined coverage from both suites above must stay at 100%. This
        # is a floor, not a target -- if it ever fails, the fix is new
        # tests for whatever went uncovered, not lowering the threshold.
        run: uv run coverage report -m --fail-under=100

      - name: Run mypy
        run: uv run mypy --config-file mypy.ini
